# Full stack in containers.  `make docker-up`  ->  dashboard http://localhost:8501, API http://localhost:8000/docs
# Set EVENT_BUS=kafka (default here) to run on Kafka; EVENT_BUS=redis uses Redis Streams instead.
x-app: &app
  build: { context: ., dockerfile: docker/app.Dockerfile }
  environment:
    PG_DSN: postgresql://postgres:postgres@postgres:5432/claimstream
    REDIS_URL: redis://redis:6379/0
    EVENT_BUS: ${EVENT_BUS:-kafka}
    KAFKA_BOOTSTRAP: kafka:9092
    RULES_URL: http://rules:8090
    API_URL: http://api:8000
  volumes: [ "./data:/app/data" ]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: claimstream }
    ports: [ "5432:5432" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  kafka:
    image: apache/kafka:3.8.0          # KRaft mode, no ZooKeeper
    ports: [ "9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4

  rules:
    build: ./rules-service
    ports: [ "8090:8090" ]

  bootstrap:                          # one-shot: download data, load DB, train models, run batch job
    <<: *app
    command: >
      sh -c "python -m claimstream.ingest.download && python -m claimstream.ingest.bootstrap &&
             python -m claimstream.ml.train_fraud && python -m claimstream.batch.spark_daily &&
             python -m claimstream.ml.train_forecast"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rules: { condition: service_healthy }

  processor:
    <<: *app
    command: python -m claimstream.stream.processor --workers 4
    depends_on: { bootstrap: { condition: service_completed_successfully }, kafka: { condition: service_started } }
    deploy: { replicas: 2 }             # scale out: consumers share the group's partitions

  producer:
    <<: *app
    command: python -m claimstream.stream.producer --rate 8
    depends_on: { bootstrap: { condition: service_completed_successfully }, kafka: { condition: service_started } }

  api:
    <<: *app
    ports: [ "8000:8000" ]
    depends_on: { bootstrap: { condition: service_completed_successfully } }

  dashboard:
    <<: *app
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: [ "8501:8501" ]
    depends_on: { api: { condition: service_started } }
